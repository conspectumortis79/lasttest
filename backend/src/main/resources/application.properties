spring.application.name=lasttest
server.address=0.0.0.0
server.port=8286
spring.web.resources.static-locations=classpath:/static/,file:${LASTTEST_FRONTEND_PATH:../frontend/dist}/
spring.mvc.static-path-pattern=/**

# Jackson allows case-insensitive enum deserialisation so that the
# frontend can send `ramping-vus` (kebab-case, executor name from k6)
# instead of `RAMPING_VUS` (enum constant). Consistent with the rest
# of the wire format, which uses kebab-case.
spring.jackson.mapper.accept-case-insensitive-enums=true

# ---- H2 embedded database --------------------------------------------
# Persists test runs, per-operation statistics (for the × N badges),
# time-series samples (VUs / RPS for the ramp chart) and the demo
# request log. The H2 file lives under ${LASTTEST_DATA_DIR} so the
# host's Docker volume mount keeps the data across container
# restarts. In the Docker image the default is /data (mounted as a
# volume); in local dev and tests the fallback is /tmp/lasttest-data
# so the JVM can write without elevated permissions. AUTO_SERVER=TRUE
# lets multiple JVMs (e.g. the dev shell and the running app) attach
# to the same file in read-only mode if the H2 console is opened.
# DB_CLOSE_DELAY=-1 keeps the DB open while the JVM is running so
# that in-flight transactions are not killed by the file lock being
# released between queries.
lasttest.data-dir=${LASTTEST_DATA_DIR:/tmp/lasttest-data}
spring.datasource.url=jdbc:h2:file:${lasttest.data-dir}/lasttest;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=${LASTTEST_DB_USER:sa}
spring.datasource.password=${LASTTEST_DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# H2 web console (DevTools only). Disabled by default because the
# console is an unauthenticated JDBC client; enable via the env
# LASTTEST_H2_CONSOLE=true when investigating locally.
spring.h2.console.enabled=${LASTTEST_H2_CONSOLE:false}
spring.h2.console.path=/h2-console

# InfluxDB 1.x defaults match the docker-compose setup and can be
# overridden via the LASTTEST_INFLUXDB_* environment variables.
# `enabled=false` disables the time-series integration entirely if
# no InfluxDB is desired.
lasttest.influxdb.url=${LASTTEST_INFLUXDB_URL:http://influxdb:8086}
lasttest.influxdb.bucket=${LASTTEST_INFLUXDB_BUCKET:k6}
lasttest.influxdb.user=${LASTTEST_INFLUXDB_USER:k6-writer}
lasttest.influxdb.token=${LASTTEST_INFLUXDB_PASSWORD:lasttest-writer-password}
lasttest.influxdb.enabled=${LASTTEST_INFLUXDB_ENABLED:true}

# ---- At-rest encryption of the timeline JSON columns --------------
# Protects the `configuration_json` and `original_request_json`
# columns of `test_run` (and the same columns for any other
# entity the mapper is extended to) with AES/GCM-256. The
# application manages the key itself: with no override below
# the service generates a random 32-byte key on first start
# and persists it to `encryption.key` inside `lasttest.data-dir`
# (file mode 0600). A subsequent restart reuses the same key,
# so a backup of the H2 file alone is unreadable without the
# key file.
#
# Operators running multiple containers against the same H2
# volume (e.g. read replicas) can pin a key by setting
# `lasttest.encryption.key` (Base64-encoded 32 bytes) or the
# matching `LASTTEST_ENCRYPTION_KEY` environment variable.
# Every container must derive the same key, otherwise the
# read path fails to decrypt rows written by the others and
# the column surfaces as `null` (a corrupt-row warning is
# logged).
#
# `lasttest.encryption.enabled=false` switches the layer off
# — the columns are stored in plaintext, the same as in
# builds before this feature shipped. Plain rows written by
# an older build are still readable when the flag is `true`
# (the encryptor auto-detects the absence of the magic
# prefix), so a fresh deploy with a new key keeps working
# without a one-shot migration.
lasttest.encryption.enabled=${LASTTEST_ENCRYPTION_ENABLED:true}
lasttest.encryption.key=${LASTTEST_ENCRYPTION_KEY:}
# Path to the 32-byte key file. Defaults to
# `${lasttest.data-dir}/encryption.key` when this property is
# empty. Set it to relocate the key file outside the H2
# volume (recommended for shared-volume backups).
lasttest.encryption.key-file=${LASTTEST_ENCRYPTION_KEY_FILE:}
