services:
  lasttest:
    container_name: lasttest
    build: .
    ports:
      - "8286:8286"
    volumes:
      # Custom CA / TrustStore for the target API (see USER_GUIDE.md §13.1).
      # Place your company's internal root CA at this path before starting
      # the container; the file itself is .gitignore'd.
      - ./certs/custom-ca.pem:/etc/lasttest/custom-ca.pem:ro
      # H2 embedded database — the named volume persists test runs,
      # operation statistics (× N), ramp-chart time series, and the
      # demo request log across container restarts. The default
      # data dir is /data, set by the Dockerfile via LASTTEST_DATA_DIR.
      # Override LASTTEST_DATA_DIR if you want to relocate it.
      - h2-data:/data
    environment:
      LASTTEST_PUBLIC_URL: http://localhost:8286/
      # TrustStore for the target API's TLS certificate. Leave PASSWORD
      # empty for PEM files; set it for PKCS12 / JKS.
      LASTTEST_TRUSTSTORE_PATH: /etc/lasttest/custom-ca.pem
      LASTTEST_TRUSTSTORE_PASSWORD: ""
      # k6 (Go) does not read the Java TrustStore. Point it at the same
      # PEM so the load-test phase trusts the target API's cert too.
      # NOTE: SSL_CERT_FILE replaces the system CA bundle for k6 — only
      # use it if all targets are signed by the custom CA above.
      SSL_CERT_FILE: /etc/lasttest/custom-ca.pem
      # --- InfluxDB target for k6 output (time-series stream) ---
      # Read by the backend to start k6 with --out influxdb=... and
      # to query the actual measured curve later from InfluxDB.
      LASTTEST_INFLUXDB_URL: http://influxdb:8086
      LASTTEST_INFLUXDB_BUCKET: k6
      LASTTEST_INFLUXDB_USER: k6-writer
      LASTTEST_INFLUXDB_PASSWORD: lasttest-writer-password
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8286/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ------------------------------------------------------------------
  # InfluxDB 1.11 — time-series storage for k6 output
  # ------------------------------------------------------------------
  # k6 v2.x only ships the classic InfluxDB v1 output. InfluxDB v2
  # rejects v1 writes with "unauthorized", and an xk6 plugin would
  # be a larger build change. We therefore use InfluxDB 1.11 — small,
  # fast, k6-native. The data lands in the default database `k6`,
  # retention policy `autogen`.
  #
  # Persistence via named volume. On first start, the `k6`
  # database is created automatically and an admin user with
  # read/write permissions is provisioned.
  influxdb:
    container_name: lasttest-influxdb
    image: influxdb:1.11
    ports:
      # UI reachable at http://localhost:8086/ (login details below)
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb
      - ./influxdb/init:/docker-entrypoint-initdb.d:ro
    environment:
      INFLUXDB_ADMIN_USER: admin
      INFLUXDB_ADMIN_PASSWORD: lasttest-admin-password
      INFLUXDB_USER: k6-writer
      INFLUXDB_USER_PASSWORD: lasttest-writer-password
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8086/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Grafana (optional) — preconfigured dashboard for ad-hoc analyses
  # ------------------------------------------------------------------
  # Only started if you want to inspect the time series directly in
  # Grafana. Access at http://localhost:3000/ (admin/admin).
  grafana:
    container_name: lasttest-grafana
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Initial-mount für den "lasttest"-Dashboard-Provider (siehe
      # grafana/provisioning/dashboards/dashboards.yml). Ohne diesen
      # Mount zeigt der Provider auf /var/lib/grafana/dashboards, das
      # beim ersten Container-Start noch nicht existiert — Folge:
      # "stat /var/lib/grafana/dashboards: no such file or directory".
      # Das Repo-Verzeichnis enthält eine .gitkeep als Marker und ist
      # der Ablageort für eigene Dashboard-JSONs.
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  influxdb-data:
  grafana-data:
  h2-data:
